[project]
name = "py-boilerplate"
version = "0.1.0"
description = "Boilerplate Python per progetti sviluppati interamente tramite agenti AI"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.163.1,<0.164",
  "mcp>=2.3.0,<3",
  "pydantic>=2.14.3,<3",
  "pydantic-settings>=2.16.3,<3",
  "structlog>=26.1.0,<27",
  "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
  "bandit>=1.9.4,<2",
  "coverage[toml]>=7.17.3,<8",
  "deptry>=0.25.1,<0.26",
  "httpx>=0.28.1,<0.29",
  "import-linter>=2.16,<3",
  "mypy>=2.4.1,<3",
  "pip-audit>=2.10.1,<3",
  "pymarkdownlnt>=0.9.42,<0.10",
  "pytest>=9.2.0,<10",
  "pytest-asyncio>=1.5.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.17.5,<0.18",
]

[project.scripts]
py-boilerplate = "py_boilerplate.entrypoints.cli.main:main"
py-boilerplate-api = "py_boilerplate.entrypoints.api.main:main"
py-boilerplate-mcp = "py_boilerplate.entrypoints.mcp.server:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_boilerplate"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "tools"]
exclude = [".kilo"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
  "T20",
  "S",
  "PT",
  "ASYNC",
  "C4",
  "PTH",
  "DTZ",
  "RET",
  "N",
]
ignore = [
  # Tests need native assertions; production code does not use assert for input validation.
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"tools/**" = ["T20", "S603", "S607"]
"src/py_boilerplate/entrypoints/**" = ["S104"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = "src"
files = ["src", "tests", "tools"]
exclude = ["^\\.kilo/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "e2e: full-process end-to-end tests (slow)",
]

[tool.coverage.run]
branch = true
source = ["py_boilerplate"]
omit = [
  # Composition roots and process bootstrap: exercised by spawned-process
  # integration and E2E tests, which coverage cannot track (documented exclusion).
  "src/py_boilerplate/entrypoints/cli/main.py",
  "src/py_boilerplate/entrypoints/api/main.py",
  "src/py_boilerplate/entrypoints/mcp/server.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.coverage.json]
output = "coverage/coverage.json"
pretty_print = true

[tool.deptry]
extend_exclude = ["tests", "tools", "docs", ".kilo"]
known_first_party = ["py_boilerplate"]
package_module_name_map = { "py-boilerplate" = "py_boilerplate" }

[tool.deptry.per_rule_ignores]
# CLI-only or pytest-plugin dependencies are never imported by application code.
DEP002 = [
  "bandit",
  "coverage",
  "deptry",
  "import-linter",
  "mypy",
  "pip-audit",
  "pymarkdownlnt",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
]
